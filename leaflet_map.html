
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        #info {
            position: absolute; top: 10px; left: 50px; z-index: 999;
            background: white; padding: 8px 12px; border-radius: 6px;
            font-family: Arial; font-size: 13px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info">🔍 Zoom in (niveau 13+) om wegvakken te laden</div>

    <script>
        const map = L.map("map").setView([52.1, 5.3], 8);
        let wegvakLayer = L.geoJSON(null, {
            style: { color: "#0066FF", weight: 2, opacity: 0.8 },
            onEachFeature: function(feature, layer) {
                if (feature.properties) {
                    const props = Object.entries(feature.properties)
                        .filter(([k]) => k !== "geometry")
                        .map(([k, v]) => `<b>${k}:</b> ${v}`)
                        .join("<br>");
                    layer.bindPopup(`<div style="font-family:Arial;font-size:12px;max-height:200px;overflow-y:auto;">
                        <b>Wegvak info</b><br>${props}
                    </div>`);
                }
            }
        }).addTo(map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 19
        }).addTo(map);

        let loadTimeout = null;

        map.on("moveend zoomend", function() {
            const zoom = map.getZoom();
            if (zoom >= 13) {
                clearTimeout(loadTimeout);
                loadTimeout = setTimeout(laadWegvakken, 400);
            } else {
                wegvakLayer.clearLayers();
                document.getElementById("info").innerHTML =
                    "🔍 Zoom in (niveau 13+) om wegvakken te laden";
            }
        });

        function laadWegvakken() {
            const bounds = map.getBounds();
            const url = `http://localhost:8765/wegvakken?` +
                `min_lon=${bounds.getWest()}&min_lat=${bounds.getSouth()}` +
                `&max_lon=${bounds.getEast()}&max_lat=${bounds.getNorth()}`;

            document.getElementById("info").innerHTML = "⏳ Wegvakken laden...";

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    wegvakLayer.clearLayers();
                    wegvakLayer.addData(data);
                    const count = data.features ? data.features.length : 0;
                    document.getElementById("info").innerHTML =
                        `✅ ${count} wegvakken geladen (zoom: ${map.getZoom()})`;
                })
                .catch(err => {
                    document.getElementById("info").innerHTML = "❌ Fout: " + err;
                });
        }
    </script>
</body>
</html>
